<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Lukas Stracke – software engineer working on SDKs, developer tooling, observability and testing."
    />
    <script>
      // Theme: runs before first paint so there's no flash of the wrong theme.
      // No stored value means "follow the OS". Works without SvelteKit's client JS,
      // since most pages are prerendered with csr = false.
      (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var stored = null;
        try {
          stored = localStorage.getItem(KEY);
        } catch (e) {}
        if (stored === 'light' || stored === 'dark') root.setAttribute('data-theme', stored);

        function current() {
          return root.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light');
        }
        function label() {
          var next = current() === 'dark' ? 'light' : 'dark';
          document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
            b.setAttribute('aria-label', 'Switch to ' + next + ' theme');
            b.setAttribute('title', 'Switch to ' + next + ' theme');
          });
        }

        document.addEventListener('click', function (e) {
          var btn = e.target.closest && e.target.closest('[data-theme-toggle]');
          if (!btn) return;
          var next = current() === 'dark' ? 'light' : 'dark';
          var system = mq.matches ? 'dark' : 'light';
          try {
            // Picking the OS theme again goes back to following the OS.
            if (next === system) localStorage.removeItem(KEY);
            else localStorage.setItem(KEY, next);
          } catch (e) {}
          // Switch instantly: suppress hover transitions so colors don't fade across themes.
          root.classList.add('theme-switching');
          if (next === system) root.removeAttribute('data-theme');
          else root.setAttribute('data-theme', next);
          label();
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              root.classList.remove('theme-switching');
            });
          });
        });
        mq.addEventListener && mq.addEventListener('change', label);
        document.addEventListener('DOMContentLoaded', label);
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link href="/prism-vsc-dark-plus.css" rel="stylesheet" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
